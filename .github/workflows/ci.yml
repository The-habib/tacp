name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality:
    name: Complete Verification Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv Toolchain
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Verify Lockfile Consistency (uv.lock)
        run: |
          uv lock --check

      - name: Install Dependencies from Committed Lockfile
        run: |
          uv sync --locked --all-extras

      - name: Shell Scripts Hygiene (ShellCheck)
        run: |
          shellcheck verify doctor

      - name: Code Formatting Check (Ruff)
        run: |
          uv run ruff format --check .

      - name: Code Linting Check (Ruff)
        run: |
          uv run ruff check .

      - name: Static Type Checking (Mypy)
        run: |
          uv run mypy src tests

      - name: Execute Full Verification Test Suite
        run: |
          uv run pytest tests/unit tests/integration tests/security -v -m "not device" --cov=src --cov-report=term-missing

      - name: Verify Package Build
        run: |
          uv build

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacp"
version = "0.4.0rc1"
description = "Termux AI Control Plane"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "The Habib / TACP Team", email = "tgff28970@email.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Topic :: Security",
    "Topic :: System :: Operating System",
]
dependencies = []

[project.scripts]
tacp = "tacp.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tacp = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "benchmarks",
    "artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501", "S101", "S104", "S105", "S110", "S310", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S103", "S106", "S108", "S110", "S310", "S311", "S603", "S607"]
"scripts/*" = ["S310", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["tacp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "device: marks tests requiring a real Termux or Android device environment (DEVICE-ONLY)",
]

[tool.mypy]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "tests",
]
ignore_errors = true
